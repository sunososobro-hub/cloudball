<div id="stage"></div>
<div id="sb" class="panel">
  <div id="lsWrap"><table id="ls"></table></div>
  <div class="sit">

    <div class="dots">B <i class="b"></i><i class="b"></i><i class="b"></i></div>
    <div class="bases" aria-label="壘包"><i style="left:16px;top:3px"></i><i style="left:29px;top:16px"></i><i style="left:3px;top:16px"></i></div>

  </div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>

<script type="module">
/* The intro line comes straight from league/ and does not wait for three.js. */
import {TEAMS as LEAGUE_TEAMS} from './league/teams.js';
const [teamA,teamB]=LEAGUE_TEAMS;document.getElementById('introMatch').textContent=`今晚 ${teamA.name} 對 ${teamB.name}`;
const pick=document.getElementById('introTeam').children;pick[0].textContent=`我挺${teamA.short}`;pick[1].textContent=`我挺${teamB.short}`;
/* Poster: away team left, home team right (same order as render/game.js). A logo that fails to load leaves a team-colour tile with the short name. */
for(const [id,T] of [['sideA',teamA],['sideB',teamB]]){
  const side=document.getElementById(id),mark=side.firstElementChild;side.style.setProperty('--tc',T.css);side.lastElementChild.textContent=T.name;
  const img=new Image();img.alt=T.name;img.draggable=false;
  img.onerror=()=>{img.remove();side.classList.add('nologo');mark.textContent=T.short};
  img.src=`assets/logos/${T.id}_512.webp`;mark.appendChild(img)}
</script>
<script type="module">
/* #133: every load starts at once (they used to wait for each other); each finished stage moves the bar (BOOT.N stages counted). */
const B=window.BOOT,st=p=>p.then(v=>{B.step();return v},e=>{B.step();throw e});
const pThree=st(import('three/webgpu')),pTsl=st(import('three/tsl')),
  pFx=st(Promise.all([import('three/addons/tsl/display/BloomNode.js'),import('three/addons/tsl/display/GTAONode.js'),import('three/addons/tsl/display/FXAANode.js')])),
  pEngine=st(import('./engine/index.js')),
  /* The frozen first game: played instead of a live simulation. Missing or broken file: window.OPENING stays null and the page falls back to a live game. */
  pOpening=st(fetch('league/preseason/opening.json').then(r=>r.ok?r.text():null).then(t=>t?import('./league/recording.js').then(m=>m.parseRecording(t)):null)).catch(e=>{console.warn('frozen game failed to load',e);return null}),
  pComm=st(import('./commentary/index.js')),
  pBank=st(pComm.then(m=>m.loadBank())).catch(e=>{console.warn('commentary bank failed to load; the booth stays silent',e);return null}),
  /* highlights reel of the frozen game (#118): pure list from the recorded stream; missing file = no 「看精華」 button */
  pHl=st(import('./render/highlights.js')).catch(e=>{console.warn('highlights failed to load',e);return null}),
  /* 骨架球員(render/players.js)：先載 assets/players.b64.txt；載不到就用程式生成的骨架人（一樣的關節介面） */
  pPl=st(import('./render/players.js')).then(PL=>st(PL.loadPlayerAssets('assets/')).catch(e=>console.warn('players 素材載入失敗，改用程式生成人體',e)).then(()=>PL)).catch(e=>{console.error('players.js 載入失敗',e);return null});
const THREE=await pThree,TSL=await pTsl,[{bloom},{ao},{fxaa}]=await pFx;
window.THREE=THREE;window.TSL=TSL;window.FX={bloom,ao,fxaa};
const R=new THREE.WebGPURenderer({antialias:true,forceWebGL:!!window.FORCE_GL||(()=>{try{return localStorage.getItem("zu_gl")==="1"}catch(e){return false}})()});try{await st(R.init())}catch(e){console.error(e)}window.RENDERER=R;
/* The engine (pure game logic) and the commentary booth are ES modules; the 3D/UI code (render/game.js) is a classic script that reads them from window. */
const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('failed to load '+src));document.body.appendChild(s)});
window.PL=await pPl;window.ENGINE=await pEngine;window.OPENING=await pOpening;window.COMMENTARY=await pComm;window.COMMENTARY_BANK=await pBank;window.HIGHLIGHTS=await pHl;
await load('render/game.js');
/* #125: the park is compiled and drawn behind the poster before the buttons wake up, so pressing enter never lands on a frozen tab */
await window.READY;document.getElementById('enter').textContent='進場（開聲音）';
for(const id of ['enter','enterHl','enterMute'])document.getElementById(id).disabled=false;
</script>
