<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自創球員・雲端職棒</title>
<!-- the 3D preview (#189) uses the same three.js build as the match page; the import map must come before any module script -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.min.js"}}</script>
<script src="ui/site.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/guide.css">
<link rel="stylesheet" href="ui/agent.css">
</head>
<body class="wide">
<header class="top">
  <a class="back" href="guide.html">← 球隊與球員介紹</a>
  <h1>自創球員</h1>
  <p class="lead">開發版：每個人能建立一位自己的自由球員，做他的經紀人。帳號目前只存在這個瀏覽器裡（沒有密碼、沒有信箱），清掉瀏覽器資料就找不回來。</p>
</header>
<p class="prod-note" id="agentClosed">還沒開放。</p>
<main id="agentMain" class="dev-only">
  <p id="status" class="status" role="status">載入中…</p>
  <div id="stage" class="stage" hidden>
    <svg class="stage-sil" viewBox="0 0 60 110" aria-hidden="true"><circle cx="30" cy="12" r="8"/><path d="M18 24h24l5 34-7 2-3-18v26l5 40h-9l-3-34-3 34h-9l5-40V42l-3 18-7-2z"/></svg>
    <p class="stage-note" role="status" hidden></p>
    <p class="stage-cap" id="stageCap"></p>
  </div>
  <p id="stageNeed" class="left need" hidden></p>
  <section id="maker" hidden></section>
  <section id="mine" hidden></section>
  <section id="market" hidden>
    <h2>自由球員名單</h2>
    <div class="seg" id="sortBar" role="group" aria-label="排序"></div>
    <ul class="roster" id="faList"></ul>
    <p class="empty" id="faEmpty" hidden>還沒有人建立球員。</p>
    <button type="button" class="btn ghost" id="faMore" hidden>再看更多</button>
  </section>
</main>
<footer>
  <p>沒有 cookie。3D 預覽用的 three.js 和比賽頁一樣，從 jsDelivr 載入。為了擋濫用，註冊當下會把網路位址加鹽雜湊，只記一天、不跟帳號放在一起。</p>
</footer>
<script type="module" src="ui/agent.js"></script>
</body>
</html>
