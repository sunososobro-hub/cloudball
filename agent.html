<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自創球員・雲端職棒</title>
<script src="ui/site.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/guide.css">
<link rel="stylesheet" href="ui/agent.css">
</head>
<body>
<header class="top">
  <a class="back" href="guide.html">← 球隊與球員介紹</a>
  <h1>自創球員</h1>
  <p class="lead">開發版：每個人能建立一位自己的自由球員，做他的經紀人。帳號目前只存在這個瀏覽器裡（沒有密碼、沒有信箱），清掉瀏覽器資料就找不回來。</p>
</header>
<p class="prod-note" id="agentClosed">還沒開放。</p>
<main id="agentMain" class="dev-only">
  <p id="status" class="status" role="status">載入中…</p>
  <section id="account" hidden></section>
  <section id="maker" hidden></section>
  <section id="mine" hidden></section>
  <section id="market" hidden>
    <h2>自由球員名單</h2>
    <div class="seg" id="sortBar" role="group" aria-label="排序"></div>
    <ul class="roster" id="faList"></ul>
    <p class="empty" id="faEmpty" hidden>還沒有人建立球員。</p>
    <button type="button" class="btn ghost" id="faMore" hidden>再看更多</button>
  </section>
</main>
<footer>
  <p>沒有 cookie、沒有第三方程式。為了擋濫用，註冊當下會把網路位址加鹽雜湊，只記一天、不跟帳號放在一起。</p>
</footer>
<script type="module" src="ui/agent.js"></script>
</body>
</html>
